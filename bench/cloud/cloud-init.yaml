#cloud-config
package_update: true
packages: [docker.io, docker-buildx, curl, rsync, iperf3, python3, linux-tools-generic, linux-tools-common]
write_files:
  - path: /etc/sysctl.d/90-bench.conf
    content: |
      net.core.somaxconn = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.core.netdev_max_backlog = 65535
      net.ipv4.ip_local_port_range = 1024 65535
      net.ipv4.tcp_tw_reuse = 1
      fs.file-max = 2097152
      fs.nr_open = 2097152
      kernel.perf_event_paranoid = -1
      kernel.kptr_restrict = 0
  - path: /etc/security/limits.d/90-bench.conf
    content: |
      * soft nofile 1048576
      * hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576
runcmd:
  - sysctl --system
  - systemctl enable --now docker
  - touch /root/cloud-init-done
